name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
      - '**' # Roda em qualquer branch para você testar
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Analisar Frontend com SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o Sonar ler o histórico do Git

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install # Usando install para evitar erros de lockfile desatualizado

      - name: Executar SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}